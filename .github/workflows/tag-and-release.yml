name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (e.g. v2.4.1 or 2.4.1 — leading v added if missing)"
        required: true
        type: string
      commit:
        description: "Commit SHA to tag (defaults to main HEAD)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || 'main' }}

      - name: Normalize and validate version
        id: ver
        run: |
          RAW="${{ inputs.version }}"
          TAG="${RAW#v}"
          TAG="v${TAG}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: '$TAG' is not a valid semver tag (expected vMAJOR.MINOR.PATCH[-prerelease])" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Reject if tag already exists
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "ERROR: tag $TAG already exists" >&2
            exit 1
          fi

      - name: Create GitHub release and tag
        # Creating the release with a PAT (not the default GITHUB_TOKEN) makes
        # gh create the tag, which produces a tag-push event that triggers the
        # Deploy Release workflow. Tags created with GITHUB_TOKEN do not trigger
        # other workflows.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          SHA="$(git rev-parse HEAD)"
          PRERELEASE_FLAG=""
          if [[ "$TAG" =~ -([Rr][Cc]|beta|alpha) ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --target "$SHA" \
            --generate-notes \
            $PRERELEASE_FLAG
          echo "Created release $TAG at $SHA. Deploy Release workflow will run on the tag push." >> "$GITHUB_STEP_SUMMARY"
